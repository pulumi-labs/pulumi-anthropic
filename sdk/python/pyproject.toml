[project]
  name = "pulumi_anthropic"
  description = "Manage the Anthropic platform as code: Claude Managed Agents, skills, workspaces, members, service accounts, workload identity federation, and more."
  dependencies = ["packaging>=24.0", "pulumi>=3.269.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["anthropic", "claude", "agents", "ai", "category/cloud", "kind/native"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.1.0+dev"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://www.pulumi.com"
    Repository = "https://github.com/pulumi/pulumi-anthropic"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_anthropic = ["py.typed", "pulumi-plugin.json"]
