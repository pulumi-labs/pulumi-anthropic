name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pulumi/actions@v6
        with:
          # Keep in step with mise.toml. The SDK generator lives in the CLI, so
          # an unpinned version changes the generated SDKs on its own.
          pulumi-version: '3.274.0'
      - uses: golangci/golangci-lint-action@v8
      - run: make build test
      - name: Check the schema is up to date
        run: |
          make schema
          git diff --exit-code -- provider/schema.json

  build_sdks:
    # Each language generates and compiles in its own job. This replaces a byte
    # comparison against the committed SDKs: that only proved the bytes matched,
    # never that they compile, and it failed on every Pulumi codegen change.
    needs: test
    name: build_sdks (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [nodejs, python, go, dotnet, java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pulumi/actions@v6
        with:
          pulumi-version: '3.274.0'
      - if: matrix.language == 'nodejs'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: make sdk_${{ matrix.language }}
      - run: make build_${{ matrix.language }}

  acceptance:
    # Runs the examples against the live Anthropic API. Credentials are only available to
    # pushes to main and to pull requests from this repository.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    concurrency: acceptance
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_ACCEPTANCE_WORKSPACE_ID: ${{ vars.ANTHROPIC_ACCEPTANCE_WORKSPACE_ID }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pulumi/actions@v6
        with:
          pulumi-version: '3.274.0'
      - run: make test_acceptance
