name: workload-identity
runtime: yaml
description: >
  Let GitHub Actions workflows call the Anthropic API with short-lived tokens, through
  workload identity federation, instead of stored API keys.

config:
  namePrefix:
    type: string
    default: github-actions
  repository:
    type: string
    default: pulumi-labs/pulumi-anthropic
  workspaceId:
    type: string

resources:
  github:
    type: anthropic:identity:FederationIssuer
    properties:
      name: ${namePrefix}
      issuerUrl: https://token.actions.githubusercontent.com

  deployer:
    type: anthropic:identity:ServiceAccount
    properties:
      name: ${namePrefix}-deployer
      description: Deploys agents from GitHub Actions.

  deployerAccess:
    type: anthropic:identity:ServiceAccountWorkspace
    properties:
      workspaceId: ${workspaceId}
      serviceAccountId: ${deployer.id}
      workspaceRole: workspace_developer

  mainBranch:
    type: anthropic:identity:FederationRule
    properties:
      name: ${namePrefix}-main
      description: Workflows on the main branch act as the deployer.
      issuerId: ${github.id}
      workspaceId: ${workspaceId}
      oauthScope: workspace:developer
      target:
        serviceAccountId: ${deployer.id}
      match:
        audience: https://api.anthropic.com
        subjectPrefix: repo:${repository}:ref:refs/heads/main
      tokenLifetimeSeconds: 900

outputs:
  federationRuleId: ${mainBranch.id}
