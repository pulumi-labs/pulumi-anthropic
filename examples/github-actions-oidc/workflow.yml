# Copy this file to .github/workflows/anthropic-oidc-example.yml to enable it.
name: Anthropic GitHub OIDC example
on:
  workflow_dispatch:
    inputs:
      command:
        description: Deploy the example or delete its vault
        type: choice
        options: [up, destroy]
        default: up
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: anthropic-oidc-example
      cancel-in-progress: false
    env:
      # Authentication to Pulumi Cloud is separate from authentication to Anthropic.
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PULUMI_STACK: ${{ vars.ANTHROPIC_OIDC_EXAMPLE_STACK }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID_MAIN }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_FEDERATION_SERVICE_ACCOUNT_ID }}
      # API keys take precedence over federation; do not inject them into this job.
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_ADMIN_KEY: ""
      ANTHROPIC_AUTH_TOKEN: ""
      PULUMI_COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: pulumi/actions@v6
        with:
          pulumi-version: '3.274.0'
      - name: Build and install the provider from this repository
        run: make install
      - name: Configure and run the example
        working-directory: examples/github-actions-oidc
        shell: bash
        run: |
          set -euo pipefail
          : "${PULUMI_STACK:?Set ANTHROPIC_OIDC_EXAMPLE_STACK}"
          : "${ANTHROPIC_ORGANIZATION_ID:?Set ANTHROPIC_ORGANIZATION_ID}"
          : "${ANTHROPIC_WORKSPACE_ID:?Set ANTHROPIC_WORKSPACE_ID}"
          : "${ANTHROPIC_FEDERATION_RULE_ID:?Set ANTHROPIC_FEDERATION_RULE_ID_MAIN}"
          : "${ANTHROPIC_SERVICE_ACCOUNT_ID:?Set ANTHROPIC_FEDERATION_SERVICE_ACCOUNT_ID}"
          pulumi stack select "${PULUMI_STACK}" --non-interactive
          pulumi config set organizationId "${ANTHROPIC_ORGANIZATION_ID}"
          pulumi config set workspaceId "${ANTHROPIC_WORKSPACE_ID}"
          pulumi config set federationRuleId "${ANTHROPIC_FEDERATION_RULE_ID}"
          pulumi config set serviceAccountId "${ANTHROPIC_SERVICE_ACCOUNT_ID}"
          pulumi "${PULUMI_COMMAND}" --yes --non-interactive
