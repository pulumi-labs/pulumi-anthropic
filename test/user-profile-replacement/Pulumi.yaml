name: user-profile-replacement
runtime: yaml
config:
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  workspaceId:
    type: string
    default: ""
  runName:
    type: string
    default: synthetic-user-profile
  federation:
    type: string
    secret: true
    default: "null"
resources:
  anthropic:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
      workspaceId: ${workspaceId}
    options:
      version: TEST_PROVIDER_VERSION
  profile:
    type: anthropic:agents:UserProfile
    properties:
      name: ${runName}-first
      externalUserOnboardedAt: "2026-01-01T00:00:00Z"
      accessType: application
      externalId: synthetic-reference
      metadata:
        owner: test
        remove: old
    options:
      provider: ${anthropic}
outputs:
  profileId: ${profile.id}
  name: ${profile.name}
  createdAt: ${profile.createdAt}
