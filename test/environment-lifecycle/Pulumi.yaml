name: environment-lifecycle
runtime: yaml
config:
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  workspaceId:
    type: string
    default: ""
  runName:
    type: string
    default: synthetic-environment
  federation:
    type: string
    secret: true
    default: "null"
resources:
  anthropic:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
      workspaceId: ${workspaceId}
    options:
      version: TEST_PROVIDER_VERSION
  environment:
    type: anthropic:agents:Environment
    properties:
      name: ${runName}
      description: initial description
      scope: organization
      config:
        type: self_hosted
      metadata:
        owner: test
        remove: old
    options:
      provider: ${anthropic}
outputs:
  environmentId: ${environment.id}
  environmentName: ${environment.name}
  createdAt: ${environment.createdAt}
