name: tunnel-lifecycle
runtime: yaml
config:
  runName:
    type: string
    default: test-tunnel
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  federation:
    type: string
    secret: true
    default: "null"
resources:
  anthropic:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
    options:
      version: TEST_PROVIDER_VERSION
  tunnel:
    type: anthropic:agents:Tunnel
    properties:
      displayName: ${runName}-replacement
    options:
      provider: ${anthropic}
  existing:
    type: anthropic:agents:Tunnel
    get:
      id: ${tunnel.id}
    options:
      provider: ${anthropic}
outputs:
  tunnelId: ${tunnel.id}
  domain: ${tunnel.domain}
  token: ${tunnel.tunnelToken}
