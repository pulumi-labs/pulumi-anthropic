name: service-account-lifecycle
runtime: yaml
config:
  runName:
    type: string
    default: synthetic
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  federation:
    type: string
    secret: true
    default: "null"
resources:
  anthropic:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
    options:
      version: TEST_PROVIDER_VERSION
  account:
    type: anthropic:identity:ServiceAccount
    properties:
      name: ${runName}-other
    options:
      provider: ${anthropic}
  recovered:
    type: anthropic:identity:ServiceAccount
    get:
      id: ${account.id}
    options:
      provider: ${anthropic}
outputs:
  accountId: ${account.id}
  name: ${account.name}
