name: vault-lifecycle
runtime: yaml
config:
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  workspaceId:
    type: string
    default: ""
  runName:
    type: string
    default: synthetic-vault
  federation:
    type: string
    secret: true
    default: "null"
resources:
  anthropic:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
      workspaceId: ${workspaceId}
    options:
      version: TEST_PROVIDER_VERSION
  vault:
    type: anthropic:agents:Vault
    properties:
      displayName: ${runName}
      metadata:
        owner: test
    options:
      provider: ${anthropic}
  observed:
    type: anthropic:agents:Vault
    get:
      id: ${vault.id}
    options:
      provider: ${anthropic}
outputs:
  observedName: ${observed.displayName}
  vaultId: ${vault.id}
  displayName: ${vault.displayName}
  createdAt: ${vault.createdAt}
