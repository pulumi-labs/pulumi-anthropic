name: invite-lifecycle
runtime: yaml
config:
  inviteEmail:
    type: string
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  federation:
    type: string
    secret: true
    default: "null"
resources:
  anthropic:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
    options:
      version: TEST_PROVIDER_VERSION
  invite:
    type: anthropic:organization:Invite
    properties:
      email: ${inviteEmail}
      role: developer
    options:
      provider: ${anthropic}
outputs:
  inviteId: ${invite.id}
