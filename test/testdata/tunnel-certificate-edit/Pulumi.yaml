name: tunnel-certificate-lifecycle
runtime: yaml
config:
  firstTunnelId:
    type: string
  secondTunnelId:
    type: string
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  federation:
    type: string
    secret: true
    default: "null"
resources:
  anthropic:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
    options:
      version: TEST_PROVIDER_VERSION
  certificate:
    type: anthropic:agents:TunnelCertificate
    properties:
      tunnelId: ${secondTunnelId}
      caCertificatePem:
        fn::readFile: ./ca.pem
    options:
      provider: ${anthropic}
  existing:
    type: anthropic:agents:TunnelCertificate
    get:
      id: ${certificate.id}
    options:
      provider: ${anthropic}
outputs:
  certificateId: ${certificate.id}
  fingerprint: ${certificate.fingerprint}
