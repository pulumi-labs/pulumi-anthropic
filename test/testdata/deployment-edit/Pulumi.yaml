name: deployment-lifecycle
runtime: yaml
config:
  seedAgentId:
    type: string
  seedEnvironmentId:
    type: string
  seedVersionInitial:
    type: integer
  seedVersionEdited:
    type: integer
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  workspaceId:
    type: string
    default: ""
  runName:
    type: string
    default: synthetic-deployment
  federation:
    type: string
    secret: true
    default: "null"
resources:
  provider:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
      workspaceId: ${workspaceId}
    options:
      version: TEST_PROVIDER_VERSION
  deployment:
    type: anthropic:agents:Deployment
    properties:
      name: ${runName}
      agent: {id: '${seedAgentId}', version: '${seedVersionEdited}'}
      environmentId: ${seedEnvironmentId}
      initialEvents:
        - type: user.message
          content: [{type: text, text: Synthetic configuration only.}]
      metadata: {owner: test}
    options:
      provider: ${provider}
      version: TEST_PROVIDER_VERSION
  observed:
    type: anthropic:agents:Deployment
    get:
      id: ${deployment.id}
    options:
      provider: ${provider}
      version: TEST_PROVIDER_VERSION
outputs:
  deploymentId: ${deployment.id}
  status: ${deployment.status}
  observedStatus: ${observed.status}
