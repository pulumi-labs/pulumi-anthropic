name: vault-credential-lifecycle
runtime: yaml
config:
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  workspaceId:
    type: string
    default: ""
  runName:
    type: string
  federation:
    type: string
    secret: true
    default: "null"
resources:
  provider:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
      workspaceId: ${workspaceId}
    options:
      version: TEST_PROVIDER_VERSION
  vault:
    type: anthropic:agents:Vault
    properties:
      displayName: ${runName}
    options:
      provider: ${provider}
  credential:
    type: anthropic:agents:VaultCredential
    properties:
      vaultId: ${vault.id}
      displayName: ${runName}
      metadata:
        keep: "yes"
      auth:
        type: environment_variable
        secretName: PULUMI_TEST_SECRET
        secretValue:
          fn::secret: test-vault-secret-no-access
        networking:
          type: limited
          allowedHosts: [api.example.com]
        injectionLocation:
          header: true
          body: false
    options:
      provider: ${provider}
  observed:
    type: anthropic:agents:VaultCredential
    get:
      id: ${credential.id}
    options:
      provider: ${provider}
outputs:
  credentialId: ${credential.id}
  auth: ${credential.auth}
