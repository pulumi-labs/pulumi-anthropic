name: memory-store-lifecycle
runtime: yaml
config:
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  workspaceId:
    type: string
    default: ""
  runName:
    type: string
    default: synthetic-memory
  federation:
    type: string
    secret: true
    default: "null"
resources:
  anthropic:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
      workspaceId: ${workspaceId}
    options:
      version: TEST_PROVIDER_VERSION
  memory:
    type: anthropic:agents:MemoryStore
    properties:
      name: ${runName}
      description: synthetic description
      metadata:
        owner: test
        remove: old
    options:
      provider: ${anthropic}
outputs:
  storeId: ${memory.id}
  storeName: ${memory.name}
  createdAt: ${memory.createdAt}
