name: agent-lifecycle
runtime: yaml
config:
  adminKey:
    type: string
    secret: true
    default: ""
  authToken:
    type: string
    secret: true
    default: ""
  apiKey:
    type: string
    secret: true
  workspaceId:
    type: string
    default: ""
  runName:
    type: string
    default: synthetic-agent
  federation:
    type: string
    secret: true
    default: "null"
resources:
  anthropic:
    type: pulumi:providers:anthropic
    properties:
      apiKey: ${apiKey}
      adminKey: ${adminKey}
      authToken: ${authToken}
      federation: ${federation}
      workspaceId: ${workspaceId}
    options:
      version: TEST_PROVIDER_VERSION
  agent:
    type: anthropic:agents:Agent
    properties:
      name: ${runName}
      model:
        id: claude-opus-5-5
      system: synthetic prompt
      description: synthetic description
      metadata:
        owner: test
        remove: old
    options:
      provider: ${anthropic}
outputs:
  agentId: ${agent.id}
  agentName: ${agent.name}
  agentVersion: ${agent.version}
  createdAt: ${agent.createdAt}
